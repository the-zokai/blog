title: Zokai
tagline: Código, bytes e uma raposa no meio da rede
description: Blog do Zokai sobre programação, infra, jogos, costura e pinceladas de cyberpunk.
lang: pt-BR
url: "https://blog.zokai.dev"
baseurl: ""
author:
  name: Zokai

permalink: /posts/:title/
timezone: America/Sao_Paulo
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - README.md
  - vendor

# --- Opções do tema ---
zokai:
  style: pixelpunk-neon        # pixel | cyber | pixelpunk | pixelpunk-neon | ponto-cruz
  posts_per_page: 10        # usado nas listas de categoria/tag
  words_per_minute: 200
  # Contador de views privacy-friendly (https://www.goatcounter.com). Deixe vazio para desativar.
  goatcounter: ""
  # Comentários via giscus (https://giscus.app). Deixe repo vazio para desativar.
  giscus:
    repo: ""
    repo_id: ""
    category: "Comentários"
    category_id: ""
  newsletter_url: ""        # link do form de newsletter (Buttondown, Substack...)
  social:
    github: ""
    mastodon: ""
    bluesky: ""

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }
