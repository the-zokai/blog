<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — início">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="" width="44" height="44">
      <span class="brand-name">ZOKAI</span>
    </a>
    <nav class="nav" aria-label="Principal">
      {% assign path = page.url %}
      <a href="{{ '/posts/' | relative_url }}" {% if path == '/posts/' %}aria-current="page"{% endif %}>Recentes</a>
      <a href="{{ '/mais-lidos/' | relative_url }}" {% if path == '/mais-lidos/' %}aria-current="page"{% endif %}>Mais lidos</a>
      <a href="{{ '/playlists/' | relative_url }}" {% if path contains '/playlists' %}aria-current="page"{% endif %}>Playlists</a>
      <a href="{{ '/categorias/' | relative_url }}" {% if path contains '/categorias' %}aria-current="page"{% endif %}>Categorias</a>
      <a href="{{ '/arquivo/' | relative_url }}" {% if path == '/arquivo/' %}aria-current="page"{% endif %}>Arquivo</a>
      <a href="{{ '/sobre/' | relative_url }}" {% if path == '/sobre/' %}aria-current="page"{% endif %}>Sobre</a>
    </nav>
    <div class="header-tools">
      <a class="icon-btn" href="{{ '/busca/' | relative_url }}" aria-label="Buscar" title="Buscar ( / )">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M6 1h4v1h2v1h1v2h1v4h-1v2h-1v1h-1v1H6v-1H4v-1H3v-2H2V5h1V3h1V2h2zm0 2v1H5v1H4v4h1v1h1v1h4v-1h1V9h1V5h-1V4h-1V3z"/><path fill="currentColor" d="M11 11h2v1h1v1h1v2h-2v-1h-1v-1h-1z"/></svg>
      </a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 1h2v2H7zM7 13h2v2H7zM1 7h2v2H1zM13 7h2v2h-2zM3 3h2v2H3zM11 3h2v2h-2zM3 11h2v2H3zM11 11h2v2h-2zM5 5h6v6H5z"/></svg>
      </button>
    </div>
  </div>
</header>
